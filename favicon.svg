<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2F2" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF33B5" />
      <stop offset="100%" stop-color="#F6009E" />
    </linearGradient>
    <filter id="dotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F6009E" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Premium Dark Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Bold, Stylish Geometric M -->
  <!-- M Path: Left upright, central apex, right upright with punchy modern angles -->
  <path d="M 112 376 L 112 136 L 188 136 L 256 268 L 324 136 L 400 136 L 400 376 L 332 376 L 332 232 L 278 336 L 234 336 L 180 232 L 180 376 Z" 
        fill="url(#mGrad)" />

  <!-- Iconic MOLDIN Magenta Accent Dot -->
  <circle cx="424" cy="354" r="26" fill="url(#dotGrad)" filter="url(#dotGlow)" />
</svg>
